    <main>
      <section class="trial">
        <div class="section__wrapper">
          <p class="section__title-en">Trial Session</p>
          <h1 class="trial__title">無料体験セッションのお申し込み</h1>
        </div>
      </section>

      <section class="trial-form">
        <div class="inner">
          <p class="trial-form__intro">
            Routeの無料体験セッションをご希望の方は、<br />
            以下のフォームよりお申し込みください。
          </p>

          <form class="trial-form__form" action="./thanks.html" method="get">
            <div class="trial-form__field">
              <label class="trial-form__label" for="name">
                お名前
                <span class="trial-form__required">必須</span>
              </label>

              <input
                class="trial-form__input"
                type="text"
                id="name"
                name="name"
                placeholder="例）山田 太郎"
                required
              />
            </div>

            <div class="trial-form__field">
              <label class="trial-form__label" for="email">
                メールアドレス
                <span class="trial-form__required">必須</span>
              </label>

              <input
                class="trial-form__input"
                type="email"
                id="email"
                name="email"
                placeholder="例）example@example.com"
                required
              />
            </div>

            <div class="trial-form__field">
              <label class="trial-form__label" for="message">
                何か気になることがありましたらご記入ください。
                <span class="trial-form__optional">任意</span>
              </label>

              <textarea
                class="trial-form__textarea"
                id="message"
                name="message"
              ></textarea>
            </div>

            <div class="trial-form__flow">
              <p class="trial-form__flow-title">今後の流れについて</p>

              <p class="trial-form__flow-text">
                フォーム送信後、入力いただいたメールアドレス宛に<br />
                日程調整のご案内をお送りします。<br />
                迷惑メールフォルダもあわせてご確認ください。
              </p>

              <label class="trial-form__flow-confirm">
                <input type="checkbox" name="flow-confirm" required />
                <span>内容を確認しました</span>
              </label>
            </div>

            <div class="trial-form__privacy">
              <label class="trial-form__privacy-label">
                <input type="checkbox" name="privacy" required />
                <span>
                  <a href="./information.html#privacy">プライバシーポリシー</a
                  >に同意する
                </span>
              </label>
            </div>

            <button class="trial-form__submit" type="submit">
              無料体験セッションを申し込む
            </button>
          </form>
        </div>
      </section>
    </main>
